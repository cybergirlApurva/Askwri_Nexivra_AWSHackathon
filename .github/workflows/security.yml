name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit pytest
      - name: Static analysis (Bandit)
        run: bandit -r security -ll
      - name: Unit tests
        run: python -m pytest security/tests -q
      - name: Dependency audit (report only)
        continue-on-error: true
        run: if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else echo "no requirements.txt on this branch"; fi

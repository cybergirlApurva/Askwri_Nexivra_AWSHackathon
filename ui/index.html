<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskWRI</title>
<style>
  :root{--bg:#f6f7f7;--ink:#14212b;--muted:#5b6b76;--line:#d5dbdf;--accent:#17614a;--accent-ink:#fff;--cite:#e4efe9;--warn:#fbf1dc;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#10171c;--ink:#e8eef1;--muted:#97a6b0;--line:#2a3943;--accent:#4fb591;--accent-ink:#08150f;--cite:#1b2e27;--warn:#2d2616;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:860px;margin:0 auto;padding:28px 18px 120px}
  h1{font:600 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .msg{margin:22px 0}
  .q{font-weight:600;margin-bottom:6px}
  .a{white-space:pre-wrap;max-width:70ch}
  .a.declined{background:var(--warn);padding:10px 12px;border-radius:6px}
  sup a{color:var(--accent);text-decoration:none;font-weight:600;padding:0 1px}
  .src{border-left:3px solid var(--accent);background:var(--cite);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;font-size:14px}
  .src b{display:block}
  .src small{color:var(--muted)}
  .src blockquote{margin:6px 0 0;color:var(--muted)}
  .radar{font-size:13px;color:var(--muted);margin-top:6px}
  .radar a,.top a{color:var(--accent);font-weight:600;text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px}
  .row{max-width:860px;margin:0 auto;display:flex;gap:8px}
  select,input,button{font:inherit;color:inherit}
  input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent}
  select{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
  button:disabled{opacity:.5}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){.row{flex-wrap:wrap}select{flex:1}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>AskWRI</h1><a href="/radar">Demand Radar →</a></div>
  <p class="sub">Answers come only from WRI publications, and every claim links to its source passage.</p>
  <div id="log"></div>
</main>
<form id="f"><div class="row">
  <select id="mode" aria-label="Request type">
    <option value="ask">Question</option>
    <option value="brief">Briefing</option>
    <option value="gaps">Gaps</option>
  </select>
  <select id="team" aria-label="Your team (optional)">
    <option value="">Team (optional)</option>
    <option>Cities</option><option>Food</option><option>Forests</option><option>Water</option>
    <option>Climate</option><option>Energy</option><option>Communications</option>
    <option>Brazil office</option><option>India office</option><option>Africa office</option>
    <option>Mexico office</option><option>Indonesia office</option>
  </select>
  <input id="p" aria-label="Your request" placeholder="What has WRI published on electric buses in Latin America?" autocomplete="off" required>
  <button id="go">Ask</button>
</div></form>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),p=document.getElementById('p'),go=document.getElementById('go'),mode=document.getElementById('mode'),team=document.getElementById('team');
const GAP={not_loaded:'not loaded yet (WRI published it, AskWRI can't search it)',weak:'weak coverage',never_published:'no match in WRI's catalog'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=0;
function render(out){
  const id=++uid;
  const html=esc(out.answer).replace(/\[(\d+)\]/g,(m,n)=>`<sup><a href="#s${id}-${n}">[${n}]</a></sup>`);
  const srcs=out.sources.map(s=>`<div class="src" id="s${id}-${s.n}"><b>[${s.n}] ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)}</b>
  <small>${[s.year,s.program,s.language,s.page?'p.'+s.page:''].filter(Boolean).map(esc).join(', ')}</small>
  <blockquote>${esc(s.text.slice(0,400))}${s.text.length>400?'…':''}</blockquote></div>`).join('');
  const g=out.radar&&out.radar.gap_type;
  const note=g?`<div class="radar">Logged to <a href="/radar">Demand Radar</a> as ${esc(GAP[g]||g)}.</div>`:'';
  return `<div class="a ${out.declined?'declined':''}">${html}</div>${note}${srcs}`;
}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const q=p.value.trim(); if(!q) return;
  const d=document.createElement('div'); d.className='msg';
  d.innerHTML=`<div class="q">${esc(q)}</div><div class="a">Searching WRI publications…</div>`; log.appendChild(d);
  p.value=''; go.disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q,mode:mode.value,team:team.value||null})});
    if(!r.ok) throw new Error('Request failed ('+r.status+')');
    d.innerHTML=`<div class="q">${esc(q)}</div>`+render(await r.json());
  }catch(err){ d.lastChild.textContent='Could not reach the service: '+err.message; }
  go.disabled=false; d.scrollIntoView({behavior:'smooth',block:'start'});
});
</script>
</body>
</html>
